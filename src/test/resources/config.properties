# ===================================================================
# Alberta Payments Test Automation Configuration Properties
# ===================================================================

# Application Base URL
baseUrl=https://menu.albertapayments.com/

# Target Browser: chromium, firefox, webkit, chrome, msedge
browser=chromium

# Execution Mode: true for headless, false for headed
headless=true

# Global Timeout in milliseconds (30 seconds)
timeout=30000

# Environment: DEV, QA, STAGING, PROD
environment=PROD

# Failure Artifact Settings
screenshotOnFailure=true
traceOnFailure=true
videoRecording=false

# Test Reporting
reportTheme=STANDARD
reportName=Alberta Payments Automation Test Execution Report
